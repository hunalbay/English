id: gram.a1.subject-pronouns
kind: grammar
level: A1
title_tr: Kişi zamirleri (özne)
title_en: Subject pronouns
objective_tr: Bu dersin sonunda I, you, he, she, it, we, they zamirlerini cümlenin öznesi olarak doğru kullanabileceksiniz.
source: original
review_status: auto_checked
next: [gram.a1.to-be-present]
vocabulary: [I, you, he, she, it, we, they]
sections:
  - kind: explanation
    title_tr: Konu anlatımı
    text_tr: |-
      Kişi zamirleri bir ismin yerine kullanılır ve cümlede **işi yapanı** (özneyi) gösterir. "Ayşe yorgun" demek yerine "O yorgun" dediğimizde "o" bir kişi zamiridir.

      Türkçede özneyi çoğu zaman söylemeyiz, çünkü fiilin sonundaki ek kimin yaptığını zaten gösterir: "Geliyor**um**." İngilizcede fiil böyle bir ek almadığı için özne **mutlaka söylenir**: "**I** am coming."
    table:
      headers: [İngilizce, Türkçe, Açıklama]
      rows:
        - [I, ben, Her zaman büyük harfle yazılır.]
        - [you, sen / siz, Tekil ve çoğul için aynıdır.]
        - [he, o, Erkekler için.]
        - [she, o, Kadınlar için.]
        - [it, o, "Nesneler, hayvanlar, kavramlar için."]
        - [we, biz, ""]
        - [they, onlar, "İnsanlar, hayvanlar ve nesneler için ortaktır."]
  - kind: usage
    title_tr: Kullanım kuralları
    text_tr: |-
      **1. Zamir fiilden önce gelir.** Düz cümlede özne zamiri fiilin hemen önünde durur: "**She** works here."

      **2. Türkçedeki tek "o" İngilizcede üçe ayrılır.** Bir erkekten söz ediyorsanız **he**, bir kadından söz ediyorsanız **she**, bir nesne ya da hayvandan söz ediyorsanız **it** kullanırsınız.

      **3. "You" hem "sen" hem "siz" demektir.** İngilizcede ayrı bir saygı biçimi yoktur; bir arkadaşınıza da, müdürünüze de **you** dersiniz.

      **4. Çoğulda cinsiyet ayrımı yoktur.** İnsanlar, hayvanlar ve nesneler için çoğulda hep **they** kullanılır.
  - kind: examples
    title_tr: Örnek cümleler
    examples:
      - {en: "I am a student.", tr: "Ben bir öğrenciyim."}
      - {en: "You are my friend.", tr: "Sen benim arkadaşımsın."}
      - {en: "He is a doctor.", tr: "O bir doktor.", note_tr: "Bir erkekten söz ediliyor."}
      - {en: "She is from Ankara.", tr: "O Ankaralı.", note_tr: "Bir kadından söz ediliyor."}
      - {en: "It is a small house.", tr: "O küçük bir ev.", note_tr: "Bir nesneden söz ediliyor."}
      - {en: "We are at home.", tr: "Biz evdeyiz."}
      - {en: "They are happy.", tr: "Onlar mutlu."}
  - kind: correct_incorrect
    title_tr: Doğru ve yanlış kullanım
    examples:
      - {en: "Is a teacher.", tr: "(O) bir öğretmen.", wrong: true, correction: "She is a teacher.", note_tr: "İngilizcede özne atlanmaz."}
      - {en: "My brother he is tall.", tr: "Erkek kardeşim uzun boylu.", wrong: true, correction: "My brother is tall.", note_tr: "İsim ve zamir aynı özne için birlikte kullanılmaz."}
      - {en: "This is my mother. He is a nurse.", tr: "Bu benim annem. O bir hemşire.", wrong: true, correction: "This is my mother. She is a nurse.", note_tr: "Kadınlar için she kullanılır."}
      - {en: "Tom and i are friends.", tr: "Tom ve ben arkadaşız.", wrong: true, correction: "Tom and I are friends.", note_tr: "I her zaman büyük yazılır."}
  - kind: common_mistakes
    title_tr: Sık yapılan hatalar
    text_tr: |-
      **Özneyi atlamak.** Türkçe düşünerek "Am tired" ya da "Is cold" demek en yaygın hatadır. Her cümlede bir özne olmalıdır: "**I** am tired.", "**It** is cold."

      **He ile she'yi karıştırmak.** Türkçede tek bir "o" olduğu için bu hata çok doğaldır. Konuşurken kimden söz ettiğinizi bir an düşünmek zamanla alışkanlık hâline gelir.

      **Nesneler için he/she kullanmak.** Masa, kitap, araba gibi nesneler için **it** kullanılır: "This is my car. **It** is new."

      **"I" zamirini küçük yazmak.** Cümlenin neresinde olursa olsun **I** büyük harfle yazılır.
  - kind: exceptions
    title_tr: İstisnalar ve özel durumlar
    text_tr: |-
      **Hava, saat ve mesafe için "it".** Bu cümlelerde "it" belirli bir nesneyi göstermez; cümlenin özne yerini doldurur: "**It** is hot today." (Bugün hava sıcak.), "**It** is five o'clock." (Saat beş.)

      **Evcil hayvanlar.** Hayvanlar için genellikle **it** kullanılır; ancak insanlar cinsiyetini bildikleri evcil hayvanları için çoğu zaman **he** ya da **she** der: "This is my dog. **He** is three years old."
    examples:
      - {en: "It is cold today.", tr: "Bugün hava soğuk."}
      - {en: "It is seven o'clock.", tr: "Saat yedi."}
  - kind: daily_life
    title_tr: Günlük hayattan
    examples:
      - {en: "This is Elif. She is my sister.", tr: "Bu Elif. O benim kız kardeşim."}
      - {en: "Where is my phone? It is on the table.", tr: "Telefonum nerede? Masanın üstünde."}
      - {en: "Ali and Can are not here. They are at work.", tr: "Ali ile Can burada değil. Onlar işte."}
      - {en: "My friend and I are hungry. We are in the kitchen.", tr: "Arkadaşım ve ben açız. Mutfaktayız."}
  - kind: review_tips
    title_tr: Tekrar önerileri
    text_tr: |-
      Çevrenizdeki kişi ve nesnelere bakıp her biri için doğru zamiri söyleyin: annem → she, telefon → it, arkadaşlarım → they.

      Kısa cümleleri sesli söylerken özneyi bilerek vurgulayın; özneyi atlamama alışkanlığı böyle yerleşir.
questions:
  - id: q.a1.subject-pronouns.01
    type: multiple_choice
    prompt: "This is my brother. ___ is a doctor."
    options:
      - "*He :: \"My brother\" bir erkektir; erkekler için he kullanılır."
      - "She :: She kadınlar için kullanılır; brother erkek kardeş demektir."
      - "It :: It nesneler ve hayvanlar içindir; insanlar için kullanılmaz."
      - "They :: They çoğuldur; burada tek bir kişiden söz ediliyor."
    explanation: "Zamiri seçerken yerini tuttuğu isme bakılır: tek bir erkek → he."
    example: {en: "This is my father. He is a teacher.", tr: "Bu benim babam. O bir öğretmen."}
    vocabulary: [he, brother]
  - id: q.a1.subject-pronouns.02
    type: multiple_choice
    prompt: "Where is my phone? ___ is on the table."
    options:
      - "*It :: Telefon bir nesnedir; tekil nesneler için it kullanılır."
      - "He :: He yalnızca erkekler (ve bazen erkek evcil hayvanlar) için kullanılır."
      - "She :: She yalnızca kadınlar için kullanılır."
      - "They :: They çoğuldur; tek bir telefondan söz ediliyor."
    explanation: "Türkçedeki \"o\" İngilizcede üçe ayrılır. Nesneler için it kullanılır."
    vocabulary: [it, phone]
  - id: q.a1.subject-pronouns.03
    type: fill_blank
    prompt: "Ali and Can are not here. ___ are at work."
    answers: [They]
    explanation: "İki kişiden söz ediliyor; çoğul için they kullanılır."
    example: {en: "My parents are old. They are at home.", tr: "Annemle babam yaşlı. Onlar evde."}
  - id: q.a1.subject-pronouns.04
    type: fill_blank
    prompt: "My friend and I are hungry. ___ are in the kitchen."
    answers: [We]
    explanation: "\"My friend and I\" (arkadaşım ve ben) = biz. İçinde \"I\" geçen bir grup için we kullanılır."
  - id: q.a1.subject-pronouns.05
    type: true_false
    prompt: "Is a teacher."
    options:
      - "Doğru :: İngilizcede özne atlanamaz; cümlede işi yapan belirtilmemiş."
      - "*Yanlış :: Cümlede özne yok. Doğrusu: \"She is a teacher.\" ya da \"He is a teacher.\""
    explanation: "Türkçede \"Öğretmen.\" ya da \"O öğretmen.\" denebilir; İngilizcede ise her cümlede bir özne bulunmalıdır."
  - id: q.a1.subject-pronouns.06
    type: error_correction
    grading: strict
    prompt: "Tom and i are friends."
    answers: ["Tom and I are friends."]
    explanation: "\"I\" zamiri cümlenin neresinde olursa olsun büyük harfle yazılır. Bu soruda yazım değerlendirilir."
  - id: q.a1.subject-pronouns.07
    type: matching
    prompt: "Zamirleri Türkçe karşılıklarıyla eşleştirin."
    pairs:
      - [I, ben]
      - [we, biz]
      - [they, onlar]
      - [you, "sen / siz"]
    explanation: "You hem tekil (sen) hem çoğul ya da resmî (siz) için kullanılır; ayrı bir saygı biçimi yoktur."
  - id: q.a1.subject-pronouns.08
    type: multiple_choice
    difficulty: 2
    prompt: "___ is cold today."
    options:
      - "*It :: Hava durumu, saat ve mesafe söylenirken özne olarak it kullanılır."
      - "He :: He bir erkeği gösterir; hava durumu için kullanılmaz."
      - "The weather cold :: Bu seçenek zamir değildir ve cümleyi \"is is\" yapısına sokar."
      - "They :: They çoğuldur ve \"is\" ile kullanılamaz."
    explanation: "\"It is cold.\" cümlesindeki it belirli bir nesneyi göstermez; cümlenin özne yerini doldurur."
    example: {en: "It is seven o'clock.", tr: "Saat yedi."}
  - id: q.a1.subject-pronouns.09
    type: word_order
    prompt: "Cümle kurun."
    tokens: [She, is, my, sister]
    explanation: "Düz cümlede özne zamiri fiilden önce gelir: She + is + ..."
  - id: q.a1.subject-pronouns.10
    type: translation
    prompt: "Onlar mutlu."
    answers: ["They are happy.", "They're happy."]
    explanation: "Onlar = they. Çoğul öznelerle \"are\" kullanılır."
