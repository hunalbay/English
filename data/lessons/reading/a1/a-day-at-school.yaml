    - {en: "His favourite lesson is English because his teacher is very nice. He doesn't like history.", tr: "En sevdiği ders İngilizcedir çünkü öğretmeni çok iyidir. Tarihi sevmez."}
    - {en: "At twelve o'clock he has lunch at school with his friends. They usually eat soup and rice.", tr: "Saat on ikide arkadaşlarıyla okulda öğle yemeği yer. Genellikle çorba ve pilav yerler."}
    - {en: "School finishes at three. After school Mert plays basketball for an hour.", tr: "Okul üçte biter. Okuldan sonra Mert bir saat basketbol oynar."}
    - {en: "In the evening he does his homework and goes to bed at ten.", tr: "Akşam ödevini yapar ve onda yatar."}
  glossary:
