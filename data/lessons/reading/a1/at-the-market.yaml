id: read.a1.at-the-market
kind: reading
level: A1
title_tr: "Pazarda"
title_en: At the market
objective_tr: Alışverişle ilgili kısa bir metinde miktarları, fiyatları ve ne alındığını bulabileceksiniz.
source: original
review_status: auto_checked
related: [gram.a1.there-is-are]
vocabulary: [market, tomato, cheese, bread, cheap, expensive]
passage:
  mode: text
  lines:
    - {en: "Every Saturday morning Mrs Demir goes to the market near her flat.", tr: "Bayan Demir her cumartesi sabahı dairesinin yakınındaki pazara gider."}
    - {en: "The market is big and busy. There are a lot of fruit and vegetables.", tr: "Pazar büyük ve kalabalıktır. Bir sürü meyve ve sebze vardır."}
    - {en: "Today she needs tomatoes, potatoes, apples and some cheese.", tr: "Bugün domatese, patatese, elmaya ve biraz peynire ihtiyacı var."}
    - {en: "The tomatoes are cheap. They are twenty lira a kilo, so she buys two kilos.", tr: "Domatesler ucuz. Kilosu yirmi lira, bu yüzden iki kilo alıyor."}
    - {en: "The apples are red and sweet. She buys one kilo for her children.", tr: "Elmalar kırmızı ve tatlı. Çocukları için bir kilo alıyor."}
    - {en: "The cheese is expensive today, so she doesn't buy it.", tr: "Peynir bugün pahalı, bu yüzden almıyor."}
    - {en: "There isn't any bread at the market. She buys bread at the bakery on her way home.", tr: "Pazarda ekmek yok. Eve dönerken fırından ekmek alıyor."}
  glossary:
    - {en: "busy", tr: "kalabalık, yoğun"}
    - {en: "need", tr: "ihtiyacı olmak"}
    - {en: "a kilo", tr: "kilosu, bir kilo"}
    - {en: "sweet", tr: "tatlı"}
    - {en: "bakery", tr: "fırın"}
    - {en: "on her way home", tr: "eve dönerken"}
