# Seviyeler ve üniteler. Ünitelerdeki ders sırası burada belirlenir.
levels:
  - code: A1
    name_tr: Başlangıç
    description_tr: Kendinizi tanıtabilir, çok temel gündelik ifadeleri anlayıp kullanabilirsiniz.
  - code: A2
    name_tr: Temel
    description_tr: Alışveriş, aile, iş gibi tanıdık konularda basit ve doğrudan bilgi alışverişi yapabilirsiniz.
  - code: B1
    name_tr: Orta
    description_tr: Tanıdık konularda ana fikirleri anlayabilir, deneyimlerinizi ve planlarınızı anlatabilirsiniz.
  - code: B2
    name_tr: Orta üstü
    description_tr: Karmaşık metinlerin ana fikrini anlayabilir, ana dili İngilizce olanlarla akıcı biçimde iletişim kurabilirsiniz.
  - code: C1
    name_tr: İleri
    description_tr: Uzun ve zorlu metinleri anlayabilir, kendinizi akıcı, esnek ve etkili biçimde ifade edebilirsiniz.
  - code: C2
    name_tr: Ustalık düzeyi
    description_tr: Okuduğunuz ve duyduğunuz hemen her şeyi kolayca anlayabilir, ince anlam farklarını ayırt edebilirsiniz.

units:
  - id: a1.u01
    level: A1
    title_tr: İlk adımlar
    title_en: First steps
    description_tr: Kişi zamirleri, "to be" fiili ve a/an ile en temel cümleleri kurmayı öğrenin.
    lessons:
      - gram.a1.subject-pronouns
      - gram.a1.to-be-present
      - gram.a1.articles-a-an

  - id: a1.u02
    level: A1
    title_tr: İsimler ve sahiplik
    title_en: Nouns and possession
    description_tr: Çoğul isimler, işaret sözcükleri ve sahipliği anlatmanın yolları.
    lessons:
      - gram.a1.plural-nouns
      - gram.a1.this-that
      - gram.a1.possessive-adjectives
      - gram.a1.possessive-s
      - gram.a1.have-got

  - id: a1.u03
    level: A1
    title_tr: Günlük hayat
    title_en: Everyday life
    description_tr: Geniş zamanla alışkanlıklarınızı anlatın, soru sorun ve sıklık bildirin.
    lessons:
      - gram.a1.present-simple
      - gram.a1.present-simple-negative-questions
      - gram.a1.adverbs-of-frequency
      - gram.a1.question-words
      - gram.a1.object-pronouns

  - id: a1.u04
    level: A1
    title_tr: Yer, zaman ve miktar
    title_en: Place, time and quantity
    description_tr: Bir şeyin nerede ve ne zaman olduğunu söyleyin; miktar bildirin ve talimat verin.
    lessons:
      - gram.a1.there-is-are
      - gram.a1.prepositions-of-place
      - gram.a1.prepositions-of-time
      - gram.a1.some-any
      - gram.a1.imperatives

  - id: a1.u05
    level: A1
    title_tr: Şimdi, yetenek ve hoşlanma
    title_en: Now, ability and likes
    description_tr: Şu an ne yaptığınızı, neleri yapabildiğinizi ve nelerden hoşlandığınızı anlatın; cümlelerinizi bağlayın.
    lessons:
      - gram.a1.can-cant
      - gram.a1.present-continuous
      - gram.a1.like-ing
      - gram.a1.conjunctions

  - id: a1.u06
    level: A1
    title_tr: Geçmişten söz etmek
    title_en: Talking about the past
    description_tr: Geçmişteki durumları ve tamamlanmış olayları anlatın.
    lessons:
      - gram.a1.was-were
      - gram.a1.past-simple-regular
      - gram.a1.past-simple-irregular

  - id: a2.u01
    level: A2
    title_tr: Geçmişi anlatmak
    title_en: Talking about the past
    description_tr: Süren ve tamamlanan geçmiş olayları, deneyimleri ve eski alışkanlıkları anlatın.
    lessons:
      - gram.a2.past-continuous
      - gram.a2.past-simple-vs-continuous
      - gram.a2.present-perfect
      - gram.a2.present-perfect-vs-past-simple
      - gram.a2.used-to

  - id: a2.u02
    level: A2
    title_tr: Gelecekten söz etmek
    title_en: Talking about the future
    description_tr: Planlarınızı, kararlarınızı ve tahminlerinizi doğru yapıyla anlatın.
    lessons:
      - gram.a2.going-to
      - gram.a2.will
      - gram.a2.present-continuous-future

  - id: a2.u03
    level: A2
    title_tr: Karşılaştırma ve niteleme
    title_en: Comparing and describing
    description_tr: Şeyleri karşılaştırın, işlerin nasıl yapıldığını anlatın, fazlalık ve yeterlilik bildirin.
    lessons:
      - gram.a2.comparatives
      - gram.a2.superlatives
      - gram.a2.adverbs-of-manner
      - gram.a2.too-enough

  - id: a2.u04
    level: A2
    title_tr: Zorunluluk, tavsiye ve olasılık
    title_en: Obligation, advice and possibility
    description_tr: Kip fiilleriyle zorunluluk, yasak, tavsiye, kibar rica ve olasılık bildirin.
    lessons:
      - gram.a2.must-have-to
      - gram.a2.should
      - gram.a2.could
      - gram.a2.may-might

  - id: a2.u05
    level: A2
    title_tr: Miktar ve tanımlıklar
    title_en: Quantity and articles
    description_tr: Miktar sözcüklerini ve a / an, the ile tanımlıksız kullanımı doğru seçin.
    lessons:
      - gram.a2.quantifiers
      - gram.a2.articles-the

  - id: a2.u06
    level: A2
    title_tr: Cümleleri genişletmek
    title_en: Building longer sentences
    description_tr: Koşul bildirin, fiilleri art arda kullanın, isimleri cümleciklerle tanımlayın.
    lessons:
      - gram.a2.first-conditional
      - gram.a2.verb-patterns
      - gram.a2.relative-clauses
      - gram.a2.possessive-pronouns

  - id: b1.u01
    level: B1
    title_tr: Zamanlarda derinleşme
    title_en: Going deeper into tenses
    description_tr: Süregelen eylemleri, geçmişin geçmişini, alışkanlıkları ve gelecek anlatımlarını ayrıntılı kullanın.
    lessons:
      - gram.b1.present-perfect-continuous
      - gram.b1.past-perfect
      - gram.b1.used-to-be-used-to
      - gram.b1.future-forms

  - id: b1.u02
    level: B1
    title_tr: Koşullar ve dilekler
    title_en: Conditions and wishes
    description_tr: Genel doğruları, hayali durumları ve dilekleri anlatın; koşul ve zaman bağlaçlarını kullanın.
    lessons:
      - gram.b1.zero-conditional
      - gram.b1.second-conditional
      - gram.b1.wish
      - gram.b1.unless-time-clauses

  - id: b1.u03
    level: B1
    title_tr: Edilgen çatı ve dolaylı anlatım
    title_en: Passive and reported speech
    description_tr: Eylemi yapanı öne çıkarmadan anlatın, başkalarının sözlerini ve sorularını aktarın, kibar sorular sorun.
    lessons:
      - gram.b1.passive-basics
      - gram.b1.passive-other-tenses
      - gram.b1.reported-statements
      - gram.b1.reported-questions
      - gram.b1.indirect-questions

  - id: b1.u04
    level: B1
    title_tr: Kip fiillerinde ustalaşma
    title_en: Mastering modals
    description_tr: Çıkarım yapın, yeteneği ve zorunluluğu her zamanda anlatın, tavsiye ve uyarıda bulunun.
    lessons:
      - gram.b1.modals-deduction
      - gram.b1.ability-forms
      - gram.b1.obligation-forms
      - gram.b1.advice-forms

  - id: b1.u05
    level: B1
    title_tr: Cümleleri bağlamak ve zenginleştirmek
    title_en: Connecting and enriching sentences
    description_tr: İlgi cümlecikleri ve bağlaçlarla fikirleri birleştirin, fiil kalıplarını ve onay sorularını doğru kullanın.
    lessons:
      - gram.b1.relative-clauses
      - gram.b1.gerund-infinitive
      - gram.b1.question-tags
      - gram.b1.so-such
      - gram.b1.linking-words
      - gram.b1.both-either-neither

  - id: b2.u01
    level: B2
    title_tr: Anlatı ve ileri zamanlar
    title_en: Narrative and advanced tenses
    description_tr: Geçmiş zamanları birlikte kullanarak hikâye anlatın, gelecekte tamamlanmış olacak eylemleri ifade edin.
    lessons:
      - gram.b2.past-perfect-continuous
      - gram.b2.narrative-tenses
      - gram.b2.future-perfect

  - id: b2.u02
    level: B2
    title_tr: Gerçek dışı geçmiş ve ileri koşullar
    title_en: Unreal past and advanced conditionals
    description_tr: Geçmişteki hayali durumları, pişmanlıkları ve farklı koşul türlerini anlatın.
    lessons:
      - gram.b2.third-conditional
      - gram.b2.mixed-conditionals
      - gram.b2.wish-past
      - gram.b2.conditional-alternatives

  - id: b2.u03
    level: B2
    title_tr: Edilgen, ettirgen ve aktarma
    title_en: Passive, causative and reporting
    description_tr: Haber dilindeki edilgen yapıları, bir işi yaptırmayı ve sözün amacını gösteren aktarma fiillerini kullanın.
    lessons:
      - gram.b2.passive-advanced
      - gram.b2.causative
      - gram.b2.reporting-verbs

  - id: b2.u04
    level: B2
    title_tr: Geçmişe bakan kip fiilleri
    title_en: Modals about the past
    description_tr: Geçmiş olaylar hakkında çıkarım yapın, eleştiri ve pişmanlık bildirin.
    lessons:
      - gram.b2.modals-past
      - gram.b2.should-have

  - id: b2.u05
    level: B2
    title_tr: Yazıda ustalık
    title_en: Precision in writing
    description_tr: Cümlecikleri kısaltın, ince karşılaştırmalar yapın, resmî bağlayıcıları ve tanımlıkları doğru kullanın.
    lessons:
      - gram.b2.participle-clauses
      - gram.b2.comparatives-advanced
      - gram.b2.linking-advanced
      - gram.b2.verb-object-infinitive
      - gram.b2.articles-advanced

  - id: c1.u01
    level: C1
    title_tr: Vurgu ve sözcük sırası
    title_en: Emphasis and word order
    description_tr: Devrik yapılar, vurgu cümleleri ve öne alma ile anlatımınıza güç ve resmiyet katın.
    lessons:
      - gram.c1.inversion
      - gram.c1.cleft-sentences
      - gram.c1.emphasis-fronting

  - id: c1.u02
    level: C1
    title_tr: Varsayım ve resmî yapılar
    title_en: Hypothesis and formal structures
    description_tr: If'siz koşul cümleleri, gerçek dışı geçmiş ve dilek-gereklilik kipiyle resmî dilde ustalaşın.
    lessons:
      - gram.c1.conditional-inversion
      - gram.c1.unreal-past
      - gram.c1.subjunctive

  - id: c1.u03
    level: C1
    title_tr: İnce zaman ve kip ayrımları
    title_en: Fine distinctions in tense and modality
    description_tr: Geçmişteki geleceği, olasılık derecelerini ve tamamlanmışlık bildiren mastarları kullanın.
    lessons:
      - gram.c1.future-in-the-past
      - gram.c1.modality-advanced
      - gram.c1.perfect-forms

  - id: c1.u04
    level: C1
    title_tr: Akademik ve mesleki üslup
    title_en: Academic and professional style
    description_tr: İsimleştirme, tekrardan kaçınma ve ihtiyatlı dil ile resmî yazıda ustalaşın.
    lessons:
      - gram.c1.nominalisation
      - gram.c1.ellipsis-substitution
      - gram.c1.hedging

  - id: c2.u01
    level: C2
    title_tr: İncelik ve kesinlik
    title_en: Subtlety and precision
    description_tr: Ödünleme yapıları, edilgenin ve zamanların incelikleri, niteleyicilerin yeri ile anlamı tam denetleyin.
    lessons:
      - gram.c2.concession-advanced
      - gram.c2.passive-nuances
      - gram.c2.tense-nuances
      - gram.c2.modifier-placement

  - id: c2.u02
    level: C2
    title_tr: Üslup ve metin
    title_en: Style and text
    description_tr: Üslup düzeyini duruma göre seçin, konuşmayı yönlendiren ifadeleri, kalıplaşmış yapıları ve metin dokusunu ustalıkla kullanın.
    lessons:
      - gram.c2.register
      - gram.c2.discourse-markers
      - gram.c2.fixed-structures
      - gram.c2.cohesion

  # --- Okuma ---------------------------------------------------------------
  - id: a1.read
    level: A1
    track: reading
    title_tr: A1 okuma metinleri
    title_en: A1 reading
    description_tr: Kısa ve basit cümlelerle yazılmış, günlük hayatla ilgili metinler.
    lessons:
      - read.a1.my-family
      - read.a1.a-day-at-school
      - read.a1.at-the-market

  - id: a2.read
    level: A2
    track: reading
    title_tr: A2 okuma metinleri
    title_en: A2 reading
    description_tr: Geçmiş olaylar, karşılaştırmalar ve tavsiyeler içeren kısa metinler.
    lessons:
      - read.a2.a-weekend-trip
      - read.a2.a-new-flat
      - read.a2.healthy-habits

  - id: b1.read
    level: B1
    track: reading
    title_tr: B1 okuma metinleri
    title_en: B1 reading
    description_tr: Görüş bildiren yazılar ve kısa öyküler; olay sırasını, nedenleri ve tutumları izleyin.
    lessons:
      - read.b1.working-from-home
      - read.b1.the-lost-wallet
      - read.b1.city-or-countryside

  - id: b2.read
    level: B2
    track: reading
    title_tr: B2 okuma metinleri
    title_en: B2 reading
    description_tr: Güncel ve bilimsel konularda yazılar; ana savı, kanıtları ve yazarın tutumunu belirleyin.
    lessons:
      - read.b2.the-price-of-fast-fashion
      - read.b2.why-we-forget

  - id: c1.read
    level: C1
    track: reading
    title_tr: C1 okuma metinleri
    title_en: C1 reading
    description_tr: Denemeler ve resmî yazılar; akıl yürütmeyi, örtük anlamı ve üslup seçimlerini değerlendirin.
    lessons:
      - read.c1.the-attention-economy
      - read.c1.a-letter-of-complaint

  - id: c2.read
    level: C2
    track: reading
    title_tr: C2 okuma metinleri
    title_en: C2 reading
    description_tr: Yoğun ve edebî denemeler; benzetmeleri, tonu ve ince ayrımları çözümleyin.
    lessons:
      - read.c2.the-map-and-the-territory
      - read.c2.on-translation

  # --- Dinleme -------------------------------------------------------------
  - id: a1.listen
    level: A1
    track: listening
    title_tr: A1 dinleme
    title_en: A1 listening
    description_tr: Yavaş ve açık konuşulan kısa günlük diyaloglar.
    lessons:
      - listen.a1.at-the-cafe
      - listen.a1.new-neighbour

  - id: a2.listen
    level: A2
    track: listening
    title_tr: A2 dinleme
    title_en: A2 listening
    description_tr: Rezervasyon, yol tarifi gibi günlük durumlarda ayrıntıları yakalayın.
    lessons:
      - listen.a2.booking-a-table
      - listen.a2.lost-in-the-city

  - id: b1.listen
    level: B1
    track: listening
    title_tr: B1 dinleme
    title_en: B1 listening
    description_tr: İş görüşmesi ve radyo yayını gibi daha uzun kayıtlarda ana fikri ve ayrıntıları izleyin.
    lessons:
      - listen.b1.job-interview
      - listen.b1.weather-and-plans

  - id: b2.listen
    level: B2
    track: listening
    title_tr: B2 dinleme
    title_en: B2 listening
    description_tr: Söyleşi ve telefon görüşmelerinde görüşleri, seçenekleri ve varılan sonucu anlayın.
    lessons:
      - listen.b2.podcast-sleep
      - listen.b2.customer-call

  - id: c1.listen
    level: C1
    track: listening
    title_tr: C1 dinleme
    title_en: C1 listening
    description_tr: Akademik bir konuşmanın yapısını, savını ve konuşmacının çekincelerini izleyin.
    lessons:
      - listen.c1.lecture-cities

  - id: c2.listen
    level: C2
    track: listening
    title_tr: C2 dinleme
    title_en: C2 listening
    description_tr: Tartışmalarda örtük tutumu, ironiyi ve ince itiraz biçimlerini yakalayın.
    lessons:
      - listen.c2.debate-remote-education

  # --- Yazma ---------------------------------------------------------------
  - id: a1.write
    level: A1
    track: writing
    title_tr: A1 yazma
    title_en: A1 writing
    description_tr: Basit cümlelerle kendinizi anlatın.
    lessons: [write.a1.introducing-yourself]

  - id: a2.write
    level: A2
    track: writing
    title_tr: A2 yazma
    title_en: A2 writing
    description_tr: Arkadaşlara kısa, samimi e-postalar yazın.
    lessons: [write.a2.informal-email]

  - id: b1.write
    level: B1
    track: writing
    title_tr: B1 yazma
    title_en: B1 writing
    description_tr: Görüşünüzü düzenli bir paragrafta savunun.
    lessons: [write.b1.opinion-paragraph]

  - id: b2.write
    level: B2
    track: writing
    title_tr: B2 yazma
    title_en: B2 writing
    description_tr: Kurumlara resmî e-postalar yazın.
    lessons: [write.b2.formal-email]

  - id: c1.write
    level: C1
    track: writing
    title_tr: C1 yazma
    title_en: C1 writing
    description_tr: Mesleki ortamda öneri metinleri hazırlayın.
    lessons: [write.c1.proposal]

  - id: c2.write
    level: C2
    track: writing
    title_tr: C2 yazma
    title_en: C2 writing
    description_tr: İkna edici, üslubu denetimli denemeler yazın.
    lessons: [write.c2.argumentative-essay]

  # --- Telaffuz ------------------------------------------------------------
  - id: a1.pron
    level: A1
    track: pronunciation
    title_tr: Türkçede olmayan sesler
    title_en: Sounds that Turkish does not have
    description_tr: th, w ve iki farklı i sesi; Türkçe konuşanların en sık karıştırdığı sesler.
    lessons:
      - pron.a1.th-sounds
      - pron.a1.w-and-v
      - pron.a1.short-and-long-i

  - id: a2.pron
    level: A2
    track: pronunciation
    title_tr: Takılar ve ünsüz kümeleri
    title_en: Endings and clusters
    description_tr: -ed takısının okunuşu ve araya sesli harf eklemeden ünsüz kümeleri.
    lessons:
      - pron.a2.ed-endings
      - pron.a2.consonant-clusters

  - id: b1.pron
    level: B1
    track: pronunciation
    title_tr: Vurgu ve ritim
    title_en: Stress and rhythm
    description_tr: Sözcük vurgusu, zayıf heceler, cümle vurgusu ve bağlama.
    lessons:
      - pron.b1.word-stress
      - pron.b1.sentence-stress

  # --- Deyimler ve kalıplar ----------------------------------------------------
  - id: a1.expr
    level: A1
    track: expressions
    title_tr: Temel konuşma kalıpları
    title_en: Basic phrases
    description_tr: Selamlaşma, nezaket ve yardım isteme kalıpları.
    lessons:
      - expr.a1.everyday-phrases
      - expr.a1.survival-phrases

  - id: a2.expr
    level: A2
    track: expressions
    title_tr: Öbek fiiller ve birliktelikler
    title_en: Phrasal verbs and collocations
    description_tr: Günlük öbek fiiller ve make / do birliktelikleri.
    lessons:
      - expr.a2.phrasal-verbs-daily
      - expr.a2.make-and-do

  - id: b1.expr
    level: B1
    track: expressions
    title_tr: İş, seyahat ve günlük deyimler
    title_en: Work, travel and common idioms
    description_tr: İş ve seyahatte öbek fiiller; sık kullanılan deyimler.
    lessons:
      - expr.b1.phrasal-verbs-work-travel
      - expr.b1.common-idioms

  - id: b2.expr
    level: B2
    track: expressions
    title_tr: Deyimler, öbek fiiller ve birliktelikler
    title_en: Idioms, phrasal verbs and collocations
    description_tr: Vücutla ilgili deyimler, soyut öbek fiiller ve güçlü birliktelikler.
    lessons:
      - expr.b2.idioms-body
      - expr.b2.phrasal-verbs-advanced
      - expr.b2.strong-collocations

  - id: c1.expr
    level: C1
    track: expressions
    title_tr: İleri deyimler, atasözleri, resmî birliktelikler
    title_en: Advanced idioms, proverbs, formal collocations
    description_tr: İş ve tartışma deyimleri, atasözleri ve akademik fiil + isim birliktelikleri.
    lessons:
      - expr.c1.advanced-idioms
      - expr.c1.proverbs
      - expr.c1.academic-collocations

  - id: c2.expr
    level: C2
    track: expressions
    title_tr: Argo ve ince anlamlı deyimler
    title_en: Slang and nuanced idioms
    description_tr: Gündelik dil ve argo; kültürel göndermeler taşıyan deyimler.
    lessons:
      - expr.c2.informal-and-slang
      - expr.c2.nuanced-idioms

  # --- Mesleki İngilizce ---------------------------------------------------------
  - id: a2.prof
    level: A2
    track: professional
    title_tr: İş yerinde
    title_en: At work
    description_tr: İşinizi, görevlerinizi ve çalışma düzeninizi anlatın.
    lessons:
      - prof.a2.at-work

  - id: b1.prof
    level: B1
    track: professional
    title_tr: Yazışma ve görüşme
