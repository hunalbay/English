# Seviyeler ve üniteler. Ünitelerdeki ders sırası burada belirlenir.
levels:
  - code: A1
    name_tr: Başlangıç
    description_tr: Kendinizi tanıtabilir, çok temel gündelik ifadeleri anlayıp kullanabilirsiniz.
  - code: A2
    name_tr: Temel
    description_tr: Alışveriş, aile, iş gibi tanıdık konularda basit ve doğrudan bilgi alışverişi yapabilirsiniz.
  - code: B1
    name_tr: Orta
    description_tr: Tanıdık konularda ana fikirleri anlayabilir, deneyimlerinizi ve planlarınızı anlatabilirsiniz.
  - code: B2
    name_tr: Orta üstü
    description_tr: Karmaşık metinlerin ana fikrini anlayabilir, ana dili İngilizce olanlarla akıcı biçimde iletişim kurabilirsiniz.
  - code: C1
    name_tr: İleri
    description_tr: Uzun ve zorlu metinleri anlayabilir, kendinizi akıcı, esnek ve etkili biçimde ifade edebilirsiniz.
  - code: C2
    name_tr: Ustalık düzeyi
    description_tr: Okuduğunuz ve duyduğunuz hemen her şeyi kolayca anlayabilir, ince anlam farklarını ayırt edebilirsiniz.

units:
  - id: a1.u01
    level: A1
    title_tr: İlk adımlar
    title_en: First steps
    description_tr: Kişi zamirleri, "to be" fiili ve a/an ile en temel cümleleri kurmayı öğrenin.
    lessons:
      - gram.a1.subject-pronouns
      - gram.a1.to-be-present
      - gram.a1.articles-a-an

  - id: a1.u02
    level: A1
    title_tr: İsimler ve sahiplik
    title_en: Nouns and possession
    description_tr: Çoğul isimler, işaret sözcükleri ve sahipliği anlatmanın yolları.
    lessons:
      - gram.a1.plural-nouns
      - gram.a1.this-that
      - gram.a1.possessive-adjectives
      - gram.a1.possessive-s
      - gram.a1.have-got

  - id: a1.u03
    level: A1
    title_tr: Günlük hayat
    title_en: Everyday life
    description_tr: Geniş zamanla alışkanlıklarınızı anlatın, soru sorun ve sıklık bildirin.
    lessons:
      - gram.a1.present-simple
      - gram.a1.present-simple-negative-questions
      - gram.a1.adverbs-of-frequency
      - gram.a1.question-words
      - gram.a1.object-pronouns

  - id: a1.u04
    level: A1
    title_tr: Yer, zaman ve miktar
    title_en: Place, time and quantity
    description_tr: Bir şeyin nerede ve ne zaman olduğunu söyleyin; miktar bildirin ve talimat verin.
    lessons:
      - gram.a1.there-is-are
      - gram.a1.prepositions-of-place
      - gram.a1.prepositions-of-time
      - gram.a1.some-any
      - gram.a1.imperatives

  - id: a1.u05
    level: A1
    title_tr: Şimdi, yetenek ve hoşlanma
    title_en: Now, ability and likes
    description_tr: Şu an ne yaptığınızı, neleri yapabildiğinizi ve nelerden hoşlandığınızı anlatın; cümlelerinizi bağlayın.
    lessons:
      - gram.a1.can-cant
      - gram.a1.present-continuous
      - gram.a1.like-ing
      - gram.a1.conjunctions

  - id: a1.u06
    level: A1
    title_tr: Geçmişten söz etmek
    title_en: Talking about the past
    description_tr: Geçmişteki durumları ve tamamlanmış olayları anlatın.
    lessons:
      - gram.a1.was-were
      - gram.a1.past-simple-regular
      - gram.a1.past-simple-irregular

  - id: a2.u01
    level: A2
    title_tr: Geçmişi anlatmak
    title_en: Talking about the past
    description_tr: Süren ve tamamlanan geçmiş olayları, deneyimleri ve eski alışkanlıkları anlatın.
    lessons:
      - gram.a2.past-continuous
      - gram.a2.past-simple-vs-continuous
      - gram.a2.present-perfect
      - gram.a2.present-perfect-vs-past-simple
      - gram.a2.used-to

  - id: a2.u02
    level: A2
    title_tr: Gelecekten söz etmek
    title_en: Talking about the future
    description_tr: Planlarınızı, kararlarınızı ve tahminlerinizi doğru yapıyla anlatın.
    lessons:
      - gram.a2.going-to
      - gram.a2.will
      - gram.a2.present-continuous-future

  - id: a2.u03
    level: A2
    title_tr: Karşılaştırma ve niteleme
    title_en: Comparing and describing
    description_tr: Şeyleri karşılaştırın, işlerin nasıl yapıldığını anlatın, fazlalık ve yeterlilik bildirin.
    lessons:
      - gram.a2.comparatives
      - gram.a2.superlatives
      - gram.a2.adverbs-of-manner
      - gram.a2.too-enough

  - id: a2.u04
    level: A2
    title_tr: Zorunluluk, tavsiye ve olasılık
    title_en: Obligation, advice and possibility
    description_tr: Kip fiilleriyle zorunluluk, yasak, tavsiye, kibar rica ve olasılık bildirin.
    lessons:
      - gram.a2.must-have-to
      - gram.a2.should
      - gram.a2.could
      - gram.a2.may-might

  - id: a2.u05
    level: A2
    title_tr: Miktar ve tanımlıklar
    title_en: Quantity and articles
    description_tr: Miktar sözcüklerini ve a / an, the ile tanımlıksız kullanımı doğru seçin.
    lessons:
      - gram.a2.quantifiers
      - gram.a2.articles-the

  - id: a2.u06
    level: A2
    title_tr: Cümleleri genişletmek
    title_en: Building longer sentences
    description_tr: Koşul bildirin, fiilleri art arda kullanın, isimleri cümleciklerle tanımlayın.
    lessons:
      - gram.a2.first-conditional
      - gram.a2.verb-patterns
      - gram.a2.relative-clauses
      - gram.a2.possessive-pronouns

  - id: b1.u01
    level: B1
    title_tr: Zamanlarda derinleşme
    title_en: Going deeper into tenses
    description_tr: Süregelen eylemleri, geçmişin geçmişini, alışkanlıkları ve gelecek anlatımlarını ayrıntılı kullanın.
    lessons:
      - gram.b1.present-perfect-continuous
      - gram.b1.past-perfect
      - gram.b1.used-to-be-used-to
      - gram.b1.future-forms

  - id: b1.u02
    level: B1
    title_tr: Koşullar ve dilekler
    title_en: Conditions and wishes
    description_tr: Genel doğruları, hayali durumları ve dilekleri anlatın; koşul ve zaman bağlaçlarını kullanın.
    lessons:
      - gram.b1.zero-conditional
      - gram.b1.second-conditional
      - gram.b1.wish
      - gram.b1.unless-time-clauses

  - id: b1.u03
    level: B1
    title_tr: Edilgen çatı ve dolaylı anlatım
    title_en: Passive and reported speech
    description_tr: Eylemi yapanı öne çıkarmadan anlatın, başkalarının sözlerini ve sorularını aktarın, kibar sorular sorun.
    lessons:
      - gram.b1.passive-basics
      - gram.b1.passive-other-tenses
      - gram.b1.reported-statements
      - gram.b1.reported-questions
      - gram.b1.indirect-questions

  - id: b1.u04
    level: B1
    title_tr: Kip fiillerinde ustalaşma
    title_en: Mastering modals
    description_tr: Çıkarım yapın, yeteneği ve zorunluluğu her zamanda anlatın, tavsiye ve uyarıda bulunun.
    lessons:
      - gram.b1.modals-deduction
      - gram.b1.ability-forms
      - gram.b1.obligation-forms
      - gram.b1.advice-forms

  - id: b1.u05
    level: B1
    title_tr: Cümleleri bağlamak ve zenginleştirmek
    title_en: Connecting and enriching sentences
    description_tr: İlgi cümlecikleri ve bağlaçlarla fikirleri birleştirin, fiil kalıplarını ve onay sorularını doğru kullanın.
    lessons:
      - gram.b1.relative-clauses
      - gram.b1.gerund-infinitive
      - gram.b1.question-tags
      - gram.b1.so-such
      - gram.b1.linking-words
      - gram.b1.both-either-neither
