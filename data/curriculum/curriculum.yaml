# Seviyeler ve üniteler. Ünitelerdeki ders sırası burada belirlenir.
levels:
  - code: A1
    name_tr: Başlangıç
    description_tr: Kendinizi tanıtabilir, çok temel gündelik ifadeleri anlayıp kullanabilirsiniz.
  - code: A2
    name_tr: Temel
    description_tr: Alışveriş, aile, iş gibi tanıdık konularda basit ve doğrudan bilgi alışverişi yapabilirsiniz.
  - code: B1
    name_tr: Orta
    description_tr: Tanıdık konularda ana fikirleri anlayabilir, deneyimlerinizi ve planlarınızı anlatabilirsiniz.
  - code: B2
    name_tr: Orta üstü
    description_tr: Karmaşık metinlerin ana fikrini anlayabilir, ana dili İngilizce olanlarla akıcı biçimde iletişim kurabilirsiniz.
  - code: C1
    name_tr: İleri
    description_tr: Uzun ve zorlu metinleri anlayabilir, kendinizi akıcı, esnek ve etkili biçimde ifade edebilirsiniz.
  - code: C2
    name_tr: Ustalık düzeyi
    description_tr: Okuduğunuz ve duyduğunuz hemen her şeyi kolayca anlayabilir, ince anlam farklarını ayırt edebilirsiniz.

units:
  - id: a1.u01
    level: A1
    title_tr: İlk adımlar
    title_en: First steps
    description_tr: Kişi zamirleri, "to be" fiili ve a/an ile en temel cümleleri kurmayı öğrenin.
    lessons:
      - gram.a1.subject-pronouns
      - gram.a1.to-be-present
      - gram.a1.articles-a-an

  - id: a1.u02
    level: A1
    title_tr: İsimler ve sahiplik
    title_en: Nouns and possession
    description_tr: Çoğul isimler, işaret sözcükleri ve sahipliği anlatmanın yolları.
    lessons:
      - gram.a1.plural-nouns
      - gram.a1.this-that
      - gram.a1.possessive-adjectives
      - gram.a1.possessive-s
      - gram.a1.have-got

  - id: a1.u03
    level: A1
    title_tr: Günlük hayat
    title_en: Everyday life
    description_tr: Geniş zamanla alışkanlıklarınızı anlatın, soru sorun ve sıklık bildirin.
    lessons:
      - gram.a1.present-simple
      - gram.a1.present-simple-negative-questions
      - gram.a1.adverbs-of-frequency
      - gram.a1.question-words
      - gram.a1.object-pronouns

  - id: a1.u04
    level: A1
    title_tr: Yer, zaman ve miktar
    title_en: Place, time and quantity
    description_tr: Bir şeyin nerede ve ne zaman olduğunu söyleyin; miktar bildirin ve talimat verin.
    lessons:
      - gram.a1.there-is-are
      - gram.a1.prepositions-of-place
      - gram.a1.prepositions-of-time
      - gram.a1.some-any
      - gram.a1.imperatives

  - id: a1.u05
    level: A1
    title_tr: Şimdi, yetenek ve hoşlanma
    title_en: Now, ability and likes
    description_tr: Şu an ne yaptığınızı, neleri yapabildiğinizi ve nelerden hoşlandığınızı anlatın; cümlelerinizi bağlayın.
    lessons:
      - gram.a1.can-cant
      - gram.a1.present-continuous
      - gram.a1.like-ing
      - gram.a1.conjunctions

  - id: a1.u06
    level: A1
    title_tr: Geçmişten söz etmek
    title_en: Talking about the past
    description_tr: Geçmişteki durumları ve tamamlanmış olayları anlatın.
    lessons:
      - gram.a1.was-were
      - gram.a1.past-simple-regular
      - gram.a1.past-simple-irregular

  - id: a2.u01
    level: A2
    title_tr: Geçmişi anlatmak
    title_en: Talking about the past
    description_tr: Süren ve tamamlanan geçmiş olayları, deneyimleri ve eski alışkanlıkları anlatın.
    lessons:
      - gram.a2.past-continuous
      - gram.a2.past-simple-vs-continuous
      - gram.a2.present-perfect
      - gram.a2.present-perfect-vs-past-simple
      - gram.a2.used-to

  - id: a2.u02
    level: A2
    title_tr: Gelecekten söz etmek
    title_en: Talking about the future
    description_tr: Planlarınızı, kararlarınızı ve tahminlerinizi doğru yapıyla anlatın.
    lessons:
      - gram.a2.going-to
      - gram.a2.will
      - gram.a2.present-continuous-future

  - id: a2.u03
    level: A2
    title_tr: Karşılaştırma ve niteleme
    title_en: Comparing and describing
    description_tr: Şeyleri karşılaştırın, işlerin nasıl yapıldığını anlatın, fazlalık ve yeterlilik bildirin.
    lessons:
      - gram.a2.comparatives
      - gram.a2.superlatives
      - gram.a2.adverbs-of-manner
      - gram.a2.too-enough
