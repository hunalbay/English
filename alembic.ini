# Geliştirme sırasında yeni migration üretmek için:
#   ENGLISH_MASTER_DATA_DIR=./.devdata python -m app --no-browser   (önce şemayı güncelle)
#   alembic -x ... revision --autogenerate -m "aciklama"
# Uygulama çalışırken yapılandırma programatik olarak kurulur (app/services/migrations.py).
[alembic]
script_location = migrations
sqlalchemy.url = sqlite:///.devdata/user.db
