name: Testler

# Yalnızca kaynak kod gönderildiğinde veya elle tetiklendiğinde çalışır.
on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Bağımlılıkları kur
        run: python -m pip install -r requirements-dev.txt
      - name: İçerik veri tabanını üret
        run: python scripts/build_content.py
      - name: Testleri çalıştır
        run: python -m pytest -rs
